[tool.poetry]
name = "mxm-moneymachine"
version = "0.1.0"
description = "MVP futures trading system for Money ex Machina."
authors = ["mxm <contact@moneyexmachina.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "mxm", from = "src" }]
include = [
  { path = "LICENSE" },
  { path = "src/mxm/moneymachine/py.typed", format = "wheel" },
]

classifiers = ["Typing :: Typed"]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
mxm-types = "^0.2.2"
mxm-secrets = "^0.2.0"
mxm-refdata = "^0.3.0"
mxm-config = "^0.5.2"
mxm-dataio = "^0.4.3"
pydantic = "^2.12.5"
pydantic-settings = "^2.12.0"
cachetools = "^7.1.1"
databento = "^0.68.2"
click = "^8.2.1"
rich = "^15.0.0"
exchange-calendars = "^4.13"
prefect = "^3.7.2"

[tool.poetry.group.dev.dependencies]
isort = "^6.0.1"
black = "^25.9.0"
ruff = "^0.13.2"
pytest = "^8.4.2"
ipython = "^9.6.0"
pyright = "^1.1.406"
pandas-stubs = "^2.3.3.260113"

[tool.poetry.group.reports.dependencies]
matplotlib = "^3.10.8"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
mxm = "mxm.moneymachine.cli.main:main"

# ---- Tooling (package-local, MXM defaults) ----
[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["mxm"]
combine_as_imports = true

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E","F","I","B","UP","C90","RUF"]
ignore = ["E203","E501"]

[tool.ruff.lint.isort]
known-first-party = ["mxm"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
markers = [
    "integration: tests hitting external services (API, DB, network)",
    "slow: long-running tests (>30s, heavy compute/backtest)",
]


